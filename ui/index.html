<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sapienza agents</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <button type="button" id="newChat" class="new-chat">+ nuova chat</button>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>sapienza agents</h1>
      <p class="subtitle">interroga il sistema multi-agente in linguaggio naturale. in modalità orchestratore la domanda può essere in qualsiasi lingua, interrogando direttamente l'agente kg va scritta in inglese.</p>
      <div id="plannerBanner" class="planner-banner" hidden></div>
    </div>

    <div id="output" class="chat-scroll"></div>

    <form id="form" class="chat-form">
      <input type="text" id="question" placeholder="Who directed The Matrix?" autocomplete="off" required>
      <select id="mode">
        <option value="orchestrator">orchestratore</option>
        <option value="kg">agente kg</option>
        <option value="multiapi">agente multiapi</option>
        <option value="planner">agente planner</option>
      </select>
      <button type="submit" id="submit">chiedi</button>
    </form>
  </main>

  <aside id="settingsPanel" class="settings-panel">
    <h2 class="settings-title">impostazioni</h2>

    <div class="settings-section settings-kg">
      <label class="adv-field">knowledge graph
        <select id="kg">
          <option value="wikidata">wikidata</option>
          <option value="dbpedia">dbpedia</option>
          <option value="neo4j">neo4j (cinema)</option>
        </select>
      </label>
    </div>

    <p class="settings-placeholder">nessuna impostazione per questa modalità.</p>

    <div id="settingsPlanner" class="settings-planner">
      <label class="adv-field">provider
        <select id="advProvider">
          <option value="">auto / tutti</option>
        </select>
      </label>

      <label class="adv-field">modello
        <select id="advModel"><option value="">auto</option></select>
      </label>

      <label class="adv-field">context mode
        <select id="advContext">
          <option value="">auto</option>
          <option value="none">none</option>
          <option value="deterministic">deterministic</option>
          <option value="react">react</option>
        </select>
      </label>

      <label class="adv-field">dominio
        <select id="advDomain">
          <option value="">auto</option>
          <option value="study">studio</option>
          <option value="travel">viaggio</option>
          <option value="routine">routine</option>
        </select>
      </label>

      <div id="advToolsWrap" class="adv-field" hidden>
        <span>fonti consentite</span>
        <div id="advTools" class="adv-tools"></div>
      </div>

      <label class="adv-field">vincoli aggiuntivi
        <textarea id="advConstraints" rows="2" placeholder="es. budget massimo 300 euro"></textarea>
      </label>
    </div>
  </aside>
</div>

<script src="app.js"></script>

</body>
</html>
