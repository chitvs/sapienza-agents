server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # resolver DNS interno Docker: necessario SOLO per proxy_pass con variabile
    # (usato per kg-agent che potrebbe non essere in esecuzione)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # senza Cache-Control il browser serve il vecchio file senza rivalidare.
    # "no-cache" obbliga a chiedere: con l'ETag un file immutato torna 304.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # orchestratore: URI fisso, stripping del prefisso garantito
    location /api/orchestrator/ {
        proxy_pass http://orchestrator:8080/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # multiapi: URI fisso, stripping del prefisso garantito
    location /api/multiapi/ {
        proxy_pass http://multiapi-agent:8002/;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # kg-agent: variabile + resolver perché il container potrebbe non essere attivo
    location /api/kg/ {
        set $kg_upstream http://kg-agent:8000;
        proxy_pass $kg_upstream/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # planner: streaming SSE - buffering disattivato, altrimenti nginx accumula
    # l'intera risposta prima di inoltrarla e lo streaming diventa invisibile
    location /api/planner/query/stream {
        proxy_pass http://planner-agent:8001/query/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    # planner: URI fisso, stripping del prefisso garantito (IL BLOCCO DA NON CANCELLARE)
    location /api/planner/ {
        proxy_pass http://planner-agent:8001/;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}
