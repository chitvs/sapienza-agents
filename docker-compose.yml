services:
  # knowledge graph neo4j locale
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474"   # browser http
      - "7687:7687"   # protocollo bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_max__size=512M
      - NEO4J_server_memory_pagecache_size=256M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks:
      - agents-net

  # agente kg
  kg-agent:
    build:
      context: .
      dockerfile: agents/kg/Dockerfile
    container_name: kg-agent
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      # indici FAISS (build artifact locale, generato via scripts/ingest_wikidata.py):
      # montato invece di copiato nell'immagine, così non serve accesso di rete a
      # query.wikidata.org durante il build e l'immagine resta leggera.
      - ./agents/kg/data:/app/data:ro
      # cache dei modelli scaricati da huggingface 
      - hf-cache:/root/.cache/huggingface
    extra_hosts:
      # su Linux serve questa entry esplicita per raggiungere Ollama in esecuzione sull'host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    networks:
      - agents-net

  # agente planner
  planner-agent:
    build:
      context: ./agents/planner
      dockerfile: Dockerfile
    container_name: planner-agent
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - KG_AGENT_URL=http://kg-agent:8000
      - MULTIAPI_AGENT_URL=http://multiapi-agent:8002
    depends_on:
      - kg-agent
      - multiapi-agent
    networks:
      - agents-net

  # agente multi-api
  multiapi-agent:
    build:
      context: ./agents/multiapi
      dockerfile: Dockerfile
    container_name: multiapi-agent
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    networks:
      - agents-net

  # Orchestratore
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    ports:
      - "8080:8080"
    environment:
      - KG_AGENT_URL=http://kg-agent:8000
      - PLANNER_AGENT_URL=http://planner-agent:8001
      - MULTIAPI_AGENT_URL=http://multiapi-agent:8002
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kg-agent:
        condition: service_healthy
      planner-agent:
        condition: service_started
      multiapi-agent:
        condition: service_started
    networks:
      - agents-net

  # interfaccia web
  ui:
    image: nginx:alpine
    container_name: ui
    ports:
      - "3000:80"
    volumes:
      - ./ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui/style.css:/usr/share/nginx/html/style.css:ro
      - ./ui/app.js:/usr/share/nginx/html/app.js:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orchestrator
    networks:
      - agents-net

networks:
  agents-net:
    driver: bridge

volumes:
  neo4j-data:
  hf-cache: